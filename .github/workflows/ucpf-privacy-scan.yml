# Sample: run UCPF Playwright privacy scan in CI and upload the report artifact.
# Configure secrets: TARGET_URL, optional UCPF_SCANNER paths.
name: UCPF privacy scan

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL to scan
        required: true
        type: string
      paths:
        description: Comma-separated paths
        required: false
        default: /
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install scanner
        working-directory: tools/ucpf-scanner
        run: npm ci
      - name: Run scan
        working-directory: tools/ucpf-scanner
        run: node src/cli.js --url "${{ inputs.url }}" --paths "${{ inputs.paths }}" --out ../../ucpf-privacy-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: ucpf-privacy-report
          path: ucpf-privacy-report.json
          retention-days: 14
