name: Deploy to WordPress.org

# Requires repo secrets SVN_USERNAME and SVN_PASSWORD after wordpress.org approval.
# Until then, use GitHub Releases only (release.yml). This job no-ops when secrets are missing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  svn-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check WordPress.org credentials
        id: creds
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SVN secrets not set — skipping wordpress.org deploy (use GitHub Releases until approved)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - name: WordPress.org plugin deploy
        if: steps.creds.outputs.configured == 'true'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: universal-consent-privacy-framework
