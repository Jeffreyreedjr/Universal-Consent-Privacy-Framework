name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.wp-env/*' -print0)
